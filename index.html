        const showToast = (message, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgColor = 'bg-slate-800';
            let icon = 'fa-info-circle';

            if (type === 'success') {
                bgColor = 'bg-brand-600';
                icon = 'fa-check-circle';
            } else if (type === 'error') {
                bgColor = 'bg-red-500';
                icon = 'fa-exclamation-circle';
            }

            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-slide-up transform transition-all duration-300 z-50 min-w-[250px]`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const renderUI = (state) => {

            // Attach event listeners based on current view
            if (state === 'auth') {
                document.getElementById('auth-form').addEventListener('submit', handleAuthSubmit);
                document.getElementById('auth-switch-btn').addEventListener('click', handleAuthSwitch);
                document.getElementById('google-login-btn').addEventListener('click', handleGoogleLogin);

            } else if (state === 'forgotPassword') {
                document.getElementById('forgot-password-form').addEventListener('submit', handlePasswordReset);

            } else if (state === 'welcome') {
                document.getElementById('start-application-btn').addEventListener('click', () => {

            } else if (state === 'survey') {
                document.getElementById('beta-survey-form').addEventListener('submit', handleSurveySubmit);
            } else if (state === 'dashboard') {
                document.getElementById('dash-welcome').innerText = `Welcome, ${userProfile.name.split(' ')[0]}!`;
            }
        };

        const updateNav = () => {
            const navUserInfo = document.getElementById('nav-user-info');
            const navEmail = document.getElementById('nav-email');

            if (currentUser && userProfile) {
                navUserInfo.classList.remove('hidden');
                navEmail.innerText = userProfile.email;
            } else {
                navUserInfo.classList.add('hidden');
            }
        };

        let authMode = 'signIn';

        const handleAuthSwitch = () => {
            const form = document.getElementById('auth-form');
            const submitButton = form.querySelector('button[type="submit"]');
            const switchButton = document.getElementById('auth-switch-btn');
            const help = document.getElementById('auth-help');
            const passwordInput = document.getElementById('auth-password');
            const nameGroup = document.getElementById('auth-name-group');

            authMode = authMode === 'signIn' ? 'signUp' : 'signIn';
            nameGroup.classList.toggle('hidden', authMode === 'signIn');
            document.getElementById('auth-name').required = authMode === 'signUp';
            submitButton.innerText = authMode === 'signIn' ? 'Sign in' : 'Create account';
            switchButton.innerText = authMode === 'signIn' ? 'Create an account' : 'Sign in';
            help.innerText = authMode === 'signIn'
                ? 'Use 6 or more characters for your password.'
                : 'Your full name is required to create an account.';
            passwordInput.autocomplete = authMode === 'signIn' ? 'current-password' : 'new-password';
        };

        const handleAuthSubmit = async (event) => {
            event.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            if (authMode === 'signUp' && !name) {
                showToast("Please enter your full name.", "error");
                return;
            }

            if (!email || !password || password.length < 6) {
                showToast("Enter a valid email and a password with at least 6 characters.", "error");
                return;
            }

            showLoading(authMode === 'signIn' ? "Signing in..." : "Creating account...");

            try {
                let userCredential;
                if (authMode === 'signIn') {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                } else {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName: name });
                    authName = name;
                }

                if (authMode === 'signIn') {
                    authName = userCredential.user.displayName || email.split('@')[0];
                }
            } catch (error) {
                console.error("Authentication error:", error);
                showToast(error.message.replace('Firebase: ', ''), "error");
            } finally {
                hideLoading();
            }
        };

        const handleGoogleLogin = async () => {
            showLoading("Connecting to Google...");
            try {
                const result = await signInWithPopup(auth, googleProvider);
                authName = result.user.displayName || result.user.email.split('@')[0];
                showToast("Signed in with Google.", "success");
            } catch (error) {
                console.error("Google login error:", error);
                showToast(error.message.replace('Firebase: ', ''), "error");
            } finally {
                hideLoading();
            }
        };

        const handlePasswordReset = async (event) => {
            event.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();

            if (!email) {
                showToast("Enter your email address.", "error");
                return;
            }

            showLoading("Sending reset email...");
            try {
                await sendPasswordResetEmail(auth, email);
                showToast("Password reset email sent.", "success");
                renderUI('auth');
            } catch (error) {
                console.error("Password reset error:", error);
                showToast(error.message.replace('Firebase: ', ''), "error");
            } finally {
                hideLoading();
            }
        };

        const checkExistingProfile = async (uid) => {
            if (!uid) return;
            try {
                // Rule 1 Strict Path: /artifacts/{appId}/users/{userId}/{collectionName}
                const profileRef = doc(db, 'artifacts', appId, 'users', uid, 'beta_applications', 'survey_data');
                const docSnap = await getDoc(profileRef);

                if (docSnap.exists()) {
                    userProfile = docSnap.data();
                    updateNav();
                    renderUI('dashboard');
                } else {
                    renderUI('welcome');
                }
            } catch (error) {
                console.error("Error fetching profile:", error);
                // If permission error or network error, fallback to welcome
                renderUI('welcome');
            }
        };

        const handleSurveySubmit = async (e) => {
            e.preventDefault();

            if (!currentUser) {
                showToast("Authentication error. Please refresh.", "error");
                return;
            }

            const name = document.getElementById('field-name').value.trim();
            const email = document.getElementById('field-email').value.trim();
            const city = document.getElementById('field-city').value.trim();
            const address = document.getElementById('field-address').value.trim();
            const relation = document.getElementById('field-relation').value;
            const reason = document.getElementById('field-reason').value.trim();

            if (!name || !email || !relation || !reason) {
                showToast("Please fill all required fields.", "error");
                return;
            }

            showLoading("Saving your application...");

            try {
                // Rule 1 Strict Path: /artifacts/{appId}/users/{userId}/{collectionName}
                const profileRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'beta_applications', 'survey_data');

                const profileData = {
                    name,
                    email,
                    city,
                    address,
                    relation,
                    reason,
                    status: 'approved',
                    createdAt: serverTimestamp()
                };

                await setDoc(profileRef, profileData);
                userProfile = profileData;
                updateNav();

                // Download Excel File
                const worksheet = XLSX.utils.json_to_sheet([profileData]);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, 'FINQORA Beta Application');
                const excelData = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                const excelBlob = new Blob([excelData], {
                    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                });
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(excelBlob);
                downloadLink.download = `FINQORA_Beta_Application_${name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.xlsx`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();
                setTimeout(() => URL.revokeObjectURL(downloadLink.href), 1000);

                // Setup WhatsApp Link
                const whatsappMessage = encodeURIComponent(
                    `Hello FINQORA, my beta application has been submitted.\n\nName: ${name}\nEmail: ${email}\nCity: ${city || 'Not provided'}\nAddress: ${address || 'Not provided'}\nRelation: ${relation}\nReason: ${reason}`
                );
                const whatsappUrl = `https://wa.me/919120920817?text=${whatsappMessage}`;

                showToast("Application submitted successfully!", "success");
                
                // Show dashboard instantly
                renderUI('dashboard');

                // Open WhatsApp in a NEW tab so the user doesn't leave the dashboard
                setTimeout(() => {
                    window.open(whatsappUrl, '_blank');
                }, 1200);

            } catch (error) {
                console.error("Error saving survey:", error);
                showToast("Failed to submit. Please try again.", "error");
            } finally {
                hideLoading();
            }
        };

        // NEW: MediaFire Link added here
        window.downloadApp = (platform) => {
            if (platform === 'android') {
                showToast("Starting download...", "info");
                
                const apkUrl = "https://www.mediafire.com/file/uoyew0i28kymcl4/Finqora-v1.0.0-Release.apk/file";
                
                setTimeout(() => {
                    window.open(apkUrl, '_blank'); 
                    showToast("Redirecting to MediaFire...", "success");
                }, 800);
            }
        };

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                showLoading("Logging out...");
                await signOut(auth);
                userProfile = null;
                updateNav();
                renderUI('auth');
                showToast("Logged out successfully.", "success");
            } catch (error) {
                showToast("Error logging out.", "error");
            } finally {
                hideLoading();
            }
        });

        let authStateInitialized = false;
        const loadingTimeout = setTimeout(() => {
            if (authStateInitialized || !firebaseReady) return;
            hideLoading();
            renderUI('auth');
            showToast("Authentication is taking too long. Please check your internet connection.", "info");
        }, 15000);

        if (firebaseReady) {
            onAuthStateChanged(auth, async (user) => {
                authStateInitialized = true;
                clearTimeout(loadingTimeout);

                if (user) {
                    currentUser = user;
                    try {
                        await checkExistingProfile(user.uid);
                    } finally {
                        hideLoading();
                    }
                } else {
                    currentUser = null;
                    userProfile = null;
                    updateNav();
                    hideLoading();
                    renderUI('auth');
                }
            });
        }

        window.addEventListener('beforeunload', () => clearTimeout(loadingTimeout));

        const runCinematicPreloader = () => new Promise((resolve) => {
            const container = document.getElementById('cinematic-preloader');
            const finqora = document.getElementById('preloader-finqora');
            const yash = document.getElementById('preloader-yash');

            setTimeout(() => {
                finqora.style.opacity = '1';
            }, 500);

            setTimeout(() => {
                finqora.style.opacity = '0';
            }, 2500);

            setTimeout(() => {
                yash.style.opacity = '1';
            }, 3500);

            setTimeout(() => {
                yash.style.opacity = '0';
            }, 5500);

            setTimeout(() => {
                container.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                    resolve();
                }, 1000);
            }, 6500);
        });

        // Bootstrap with Race Condition FIX
        window.onload = async () => {
            await runCinematicPreloader();
            
            if (!firebaseReady) {
                renderUI('auth');
                hideLoading();
                return;
            }

            if (!authStateInitialized) {
                renderUI('loading');
            }
        };

    </script>
</body>

</html>
